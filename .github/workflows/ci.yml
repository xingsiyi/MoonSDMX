name: MoonSDMX check build test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      provider_check:
        description: 'Download and verify a small real ECB JSON1 provider response'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            moon: moon
          - os: windows-latest
            moon: ./scripts/Invoke-Moon.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.16+b1a0e846e'
          core-version: '0.10.16+b1a0e846e'
      - name: Windows core compiler paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $adapterScript = Join-Path $PWD 'scripts/Invoke-Moon.ps1'
          Push-Location (Join-Path $env:USERPROFILE '.moon/lib/core')
          try {
            & $adapterScript bundle --all --warn-list -a
            if ($LASTEXITCODE -ne 0) { throw 'Core bundle failed' }
          } finally { Pop-Location }
      - name: Toolchain and dependencies
        run: |
          moon version --all
          moon update
      - name: Check build test all targets
        run: |
          ${{ matrix.moon }} check --target all --deny-warn
          ${{ matrix.moon }} build --target all --deny-warn
          ${{ matrix.moon }} test --target all --deny-warn
      - name: Formatting and public interfaces
        run: |
          ${{ matrix.moon }} fmt --check
          ${{ matrix.moon }} info
          git diff --exit-code
      - name: Complete scenarios
        run: |
          ${{ matrix.moon }} run examples/open_data --target native --deny-warn
          ${{ matrix.moon }} run examples/department_kpi --target native --deny-warn
          ${{ matrix.moon }} run examples/research_revision --target native --deny-warn
          ${{ matrix.moon }} run examples/energy_catalog --target native --deny-warn
          ${{ matrix.moon }} run examples/scale --target native --release --deny-warn
          ${{ matrix.moon }} run examples/november --target native --deny-warn
          ${{ matrix.moon }} run examples/expansion --target native --deny-warn
          ${{ matrix.moon }} run examples/standard_exchange --target native --deny-warn
      - name: Standard registry and multi-dataset exchange
        run: python scripts/verify_standard_exchange.py _build/native/debug/build/cmd/moonsdmx/moonsdmx.exe
      - name: Optional real provider interoperability
        if: github.event_name == 'workflow_dispatch' && inputs.provider_check
        run: python scripts/verify_provider.py _build/native/debug/build/cmd/moonsdmx/moonsdmx.exe
      - name: Package and private-material hygiene
        run: |
          ${{ matrix.moon }} package
          python scripts/verify_repository.py
